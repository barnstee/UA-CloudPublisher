---
name: Lint

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, develop, upstream]
  pull_request:
    branches: [main, develop, upstream]
  merge_group:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@v8.6.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_CHECKOV: false
          ALIDATE_GIT_COMMITLINT: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          VALIDATE_TRIVY: false
          VALIDATE_PYTHON_BLACK: false
          # super-linter bundles the .NET 10 SDK, which cannot restore this net11.0 project;
          # these checks run in the dotnet-format job below instead
          VALIDATE_DOTNET_SLN_FORMAT_ANALYZERS: false
          VALIDATE_DOTNET_SLN_FORMAT_STYLE: false
          VALIDATE_DOTNET_SLN_FORMAT_WHITESPACE: false
          IGNORE_GITIGNORED_FILES: true
          FILTER_REGEX_EXCLUDE: .*wwwroot/.*|.gitignore

  dotnet-format:
    name: .NET format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Check whitespace formatting
        run: dotnet format whitespace UACloudPublisher.sln --verify-no-changes

      - name: Check code style
        run: dotnet format style UACloudPublisher.sln --verify-no-changes

      - name: Check analyzers
        run: dotnet format analyzers UACloudPublisher.sln --verify-no-changes
